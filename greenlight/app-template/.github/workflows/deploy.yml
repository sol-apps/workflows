name: Deploy to solhann.net

# Thin caller — the real pipeline lives once in sol-apps/workflows.
# The repo name IS the slug IS the subdomain; nothing here is app-specific.
#
# This file used to carry a `github.repository_owner == 'sol-apps'` guard, because
# it was generated into sol-forge and travelled to sol-apps unchanged at promotion,
# so it ran under both owners and had to be inert under one. There is one org now.
# The guard is gone, and the guards that matter moved INTO the reusable workflow
# where they are enforced once for every app rather than copied into every repo:
#
#   environment: prod          deployments only from main; a branch run is refused
#                              entry before its first step, so it never holds a
#                              prod credential
#   if !github.event.created   a template-generate writes main in one ref-creation
#                              push; without this that fires a deploy for a repo
#                              nobody has looked at yet
#
# KNOWN GITHUB BEHAVIOUR: a job-level `uses:` is resolved when the run is created,
# BEFORE `if:` is evaluated — a skipped job still needs its called workflow to be
# reachable. That is fine only because sol-apps/workflows is public. If it is ever
# made private, this file has to change shape (guard at the step level inside a
# local job) before that happens.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # This caller is stored in the template repository itself. Publishing a new
    # template revision must not try to deploy `app-template` as an application;
    # repositories generated from it have a different name and take the normal path.
    if: ${{ github.repository != 'sol-apps/app-template' }}
    uses: sol-apps/workflows/.github/workflows/deploy.yml@main
    secrets: inherit
